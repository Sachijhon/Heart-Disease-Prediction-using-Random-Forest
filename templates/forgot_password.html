<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - CardioAI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eef4f9;
}

.card{
    width:420px;
    background:#fff;
    padding:40px;
    border-radius:24px;
    box-shadow:0 15px 35px rgba(0,0,0,.08);
}

h2{
    text-align:center;
    color:#0a2e63;
    margin-bottom:25px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#1f4271;
}

.input-group input{
    width:100%;
    padding:15px;
    border:1px solid #d6e2ee;
    border-radius:12px;
    outline:none;
}

.input-group input:focus{
    border-color:#1673b1;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#0a2e63;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.95;
}

.success{
    color:green;
    text-align:center;
    margin-bottom:15px;
}

.error{
    color:red;
    text-align:center;
    margin-bottom:15px;
}

.back{
    text-align:center;
    margin-top:15px;
}

.back a{
    color:#1673b1;
    text-decoration:none;
}

.password-container{
    position:relative;
}

.password-container input{
    width:100%;
    padding:15px 80px 15px 15px;
}

.toggle-password{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#1673b1;
    font-weight:600;
    font-size:14px;
    user-select:none;
}

</style>
</head>
<body>

<div class="card">

    <h2>Forgot Password</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if verified %}

    <form action="/update-password" method="POST">

        <input type="hidden"
               name="email"
               value="{{ email }}">

        <div class="input-group">
    <label>New Password</label>

    <div class="password-container">
        <input type="password"
               id="new_password"
               name="new_password"
               required>

        <span class="toggle-password"
              onclick="toggleField('new_password', this)">
            Show
        </span>
    </div>
</div>

        <button type="submit">
            Update Password
        </button>

    </form>

    {% else %}

    <form action="/verify-secret" method="POST">

        <div class="input-group">
            <label>Email Address</label>
            <input type="email"
                   name="email"
                   required>
        </div>

       <div class="input-group">
    <label>Secret Code</label>

    <div class="password-container">
        <input type="password"
               id="secret_code"
               name="secret_code"
               required>

        <span class="toggle-password"
              onclick="toggleField('secret_code', this)">
            Show
        </span>
    </div>
</div>

        <button type="submit">
            Verify Secret Code
        </button>

    </form>

    {% endif %}

    <div class="back">
        <a href="/">← Back to Login</a>
    </div>

</div>

<script>
function toggleField(fieldId, element){

    const field = document.getElementById(fieldId);

    if(field.type === "password"){
        field.type = "text";
        element.innerText = "Hide";
    } else {
        field.type = "password";
        element.innerText = "Show";
    }
}
</script>

</body>
</html>
